name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # libdbus-1-dev y pkg-config son NUEVOS (modulo Bitbucket, v0.3.0):
      # el almacen de credenciales de Linux (Secret Service) se habla por
      # D-Bus, y el crate libdbus-sys no compila si no encuentra la libreria
      # de desarrollo y pkg-config para ubicarla.
      # Este paso tiene `if: matrix.platform == 'ubuntu-22.04'`, asi que los
      # runners de macOS y Windows lo saltan completo — ellos usan Keychain
      # y Credential Manager, que vienen con el sistema y no instalan nada.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Install frontend dependencies
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DevOps Hub ${{ github.ref_name }}'
          releaseBody: |
            Descarga el instalador para tu sistema operativo:
            - **macOS (Apple Silicon):** DevOps.Hub_VERSION_aarch64.dmg
            - **macOS (Intel):** DevOps.Hub_VERSION_x86_64.dmg
            - **Windows:** DevOps.Hub_VERSION_x64-setup.exe
            - **Linux:** DevOps.Hub_VERSION_amd64.AppImage
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

[package]
name = "devops-hub"
version = "0.2.20"
description = "Panel de control unificado para el equipo DevOps"
edition = "2021"

[lib]
name = "devops_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "sync"] }
base64 = "0.22"
